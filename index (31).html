<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

        // Number to Words Converter
        const numberToWords = (num) => {
            if (isNaN(num) || num === null || num === undefined) return 'Zero Only';
            num = Math.abs(Math.round(num * 100) / 100);

            const single = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
            const double = ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

            const convertBelowThousand = (n) => {
                let words = [];
                let hundreds = Math.floor(n / 100);
                let remainder = n % 100;
                let tensUnits = Math.floor(remainder / 10);
                let units = remainder % 10;

                if (hundreds > 0) {
                    words.push(single[hundreds] + ' Hundred');
                    if (remainder > 0) words.push('and');
                }

                if (remainder > 0) {
                    if (remainder < 20) {
                        words.push(remainder < 10 ? single[remainder] : double[remainder - 10]);
                    } else {
                        words.push(tens[tensUnits]);
                        if (units > 0) words.push(single[units]);
                    }
                }

                return words.filter(w => w).join(' ').trim();
            };

            let words = [];
            let rupees = Math.floor(num);
            let paise = Math.round((num - rupees) * 100);

            if (rupees === 0 && paise === 0) return 'Zero Only';

            let crores = Math.floor(rupees / 10000000);
            rupees %= 10000000;
            if (crores > 0) words.push(convertBelowThousand(crores) + ' Crore');

            let lakhs = Math.floor(rupees / 100000);
            rupees %= 100000;
            if (lakhs > 0) words.push(convertBelowThousand(lakhs) + ' Lakh');

            let thousands = Math.floor(rupees / 1000);
            rupees %= 1000;
            if (thousands > 0) words.push(convertBelowThousand(thousands) + ' Thousand');

            if (rupees > 0) words.push(convertBelowThousand(rupees));

            let rupeeWords = words.filter(w => w).join(' ').trim() || 'Zero';
            rupeeWords += ' Rupees';

            let paiseWords = '';
            if (paise > 0) {
                if (rupeeWords !== 'Zero Rupees') paiseWords += ' and ';
                paiseWords += convertBelowThousand(paise) + ' Paise';
            }

            return (rupeeWords + (paiseWords ? paiseWords : '')) + ' Only';
        };

        // Home Page Component

                                            </div>
                                            <div>
                                                <div className="mb-2"><span className="font-semibold">Total Amount:</span> ₹{bill.totalAmount.toFixed(2)}</div>
                                                <div className="mb-2"><span className="font-semibold">Amount in Words:</span> {numberToWords(bill.totalAmount)}</div>
                                            </div>
                                        </div>
                                        <div className="mb-6">
                                            <h4 className="font-bold mb-2">Bank Details:</h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <p><span className="font-semibold">Bank Name:</span> {settings.bankDetails.name}</p>
                                                    <p><span className="font-semibold">Account No:</span> {settings.bankDetails.accountNumber}</p>
                                                </div>
                                                <div>
                                                    <p><span className="font-semibold">IFSC Code:</span> {settings.bankDetails.ifsc}</p>
                                                    <p><span className="font-semibold">Branch:</span> {settings.bankDetails.branch}</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="bill-footer pt-4 mt-4">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="text-center">
                                                    <p className="font-semibold">Authorised Signatory</p>
                                                    <div className="h-16 border-t border-gray-400 mt-2"></div>
                                                </div>
                                                <div className="text-center">
                                                    <p className="font-semibold">Receiver's Signature</p>
                                                    <div className="h-16 border-t border-gray-400 mt-2"></div>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // Create Bill Page Component
        const CreateBillPage = ({ onSave, onCancel, editBill, settings, nextBillNo, createRippleEffect }) => {
            const [formData, setFormData] = useState({
                billNo: editBill?.billNo || nextBillNo,
                date: editBill?.date || new Date().toISOString().split('T')[0],
                customer: editBill?.customer || settings.receiverDetails,
                items: editBill?.items || Array(settings.billPreferences.defaultRows).fill().map(() => ({
                    description: '',
                    quantity: '',
                    rate: '',
                    amount: 0
                })),
                taxSettings: settings.taxSettings
            });

            const billRef = useRef(null);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const handleCustomerChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    customer: {
                        ...prev.customer,
                        [name]: value
                    }
                }));
            };

            const handleItemChange = (index, e) => {
                const { name, value } = e.target;
                const newItems = [...formData.items];
                
                if (name === 'description') {
                    const description = value;
                    let rate = parseFloat(newItems[index].rate) || 0;
                    for (const [pattern, mappedRate] of Object.entries(settings.rateMappings)) {
                        if (description.toLowerCase().includes(pattern.toLowerCase())) {
                            rate = mappedRate;
                            break;
                        }
                    }
                    newItems[index] = {
                        ...newItems[index],
                        [name]: value,
                        rate: rate
                    };
                } else {
                    newItems[index] = {
                        ...newItems[index],
                        [name]: value === '' ? '' : parseFloat(value) || 0
                    };
                }

                if (name === 'quantity' || name === 'rate') {
                    newItems[index].amount = (parseFloat(newItems[index].quantity) || 0) * (parseFloat(newItems[index].rate) || 0);
                }

                setFormData(prev => ({
                    ...prev,
                    items: newItems
                }));
            };

            const restoreDefaultOnBlur = (index, field, defaultValue) => (e) => {
                const newItems = [...formData.items];
                const currentValue = newItems[index][field];
                if (e.target.value === '' && currentValue === '') {
                    newItems[index] = {
                        ...newItems[index],
                        [field]: defaultValue
                    };
                } else if (e.target.value === '') {
                    newItems[index] = {
                        ...newItems[index],
                        [field]: parseFloat(currentValue) || defaultValue
                    };
                }
                if (field === 'quantity' || field === 'rate') {
                    newItems[index].amount = (parseFloat(newItems[index].quantity) || 0) * (parseFloat(newItems[index].rate) || 0);
                }
                setFormData(prev => ({
                    ...prev,
                    items: newItems
                }));
            };

            const addItemRow = () => {
                setFormData(prev => ({
                    ...prev,
                    items: [
                        ...prev.items,
                        { description: '', quantity: '', rate: '', amount: 0 }
                    ]
                }));
            };

            const removeItemRow = (index) => {
                const newItems = [...formData.items];
                newItems.splice(index, 1);
                setFormData(prev => ({
                    ...prev,
                    items: newItems
                }));
            };

            const calculateTotals = () => {
                const netAmount = formData.items.reduce((sum, item) => {
                    return sum + (isNaN(item.amount) ? 0 : parseFloat(item.amount) || 0);
                }, 0);
                const cgst = netAmount * (formData.taxSettings.cgst / 100);
                const sgst = netAmount * (formData.taxSettings.sgst / 100);
                const igst = netAmount * (formData.taxSettings.igst / 100);
                const totalAmount = netAmount + cgst + sgst + igst;

                return {
                    netAmount: isNaN(netAmount) ? 0 : netAmount,
                    cgst: isNaN(cgst) ? 0 : cgst,
                    sgst: isNaN(sgst) ? 0 : sgst,
                    igst: isNaN(igst) ? 0 : igst,
                    totalAmount: isNaN(totalAmount) ? 0 : totalAmount
                };
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (!formData.customer.name) {
                    alert('Customer name is required');
                    return;
                }

                const totals = calculateTotals();
                const billToSave = {
                    ...formData,
                    ...totals,
                    amountInWords: numberToWords(totals.totalAmount),
                    items: formData.items.map(item => ({
                        ...item,
                        quantity: item.quantity === '' ? 1 : parseFloat(item.quantity) || 0,
                        rate: item.rate === '' ? 0 : parseFloat(item.rate) || 0,
                        amount: (parseFloat(item.quantity) || 0) * (parseFloat(item.rate) || 0)
                    }))
                };

                onSave(billToSave);
            };

            const downloadBillAsImage = async () => {
                if (!billRef.current) {
                    console.error('Bill reference not found');
                    alert('Bill preview not available for download. Please ensure the bill is rendered.');
                    return;
                }

                try {
                    const canvas = await html2canvas(billRef.current, {
                        scale: 3,
                        backgroundColor: '#FFFFFF',
                        useCORS: true
                    });
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = `Invoice_${formData.billNo}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (err) {
                    console.error('Error generating image:', err);
                    alert('Failed to generate the bill image. Please try again.');
                }
            };

            const totals = calculateTotals();

                <div className="slide-in">

                        <div className="flex space-x-2">

                                onClick={(e) => {
                                    e.stopPropagation();
                                    createRippleEffect(e);
                                    onCancel();
                                }}
                                className="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded ripple"
                            >
                                Cancel
                            </button>
                            <button
                                onClick={(e) => {
                                    e.stopPropagation();
                                    createRippleEffect(e);
                                    downloadBillAsImage();
                                }}
                                className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded ripple"
                            >
                                Download Image
                            </button>
                            <button
                                onClick={(e) => {
                                    e.stopPropagation();
                                    createRippleEffect(e);
                                    handleSubmit(e);
                                }}
                                className="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded ripple"
                            >
                                {editBill ? 'Update Bill' : 'Save Bill'}
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">

                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="billNo">
                                    Bill Number
                                </label>
                                <input
                                    type="text"
                                    id="billNo"
                                    name="billNo"
                                    value={formData.billNo}
                                    onChange={handleInputChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="date">
                                    Date
                                </label>
                                <input
                                    type="date"
                                    id="date"
                                    name="date"
                                    value={formData.date}
                                    onChange={handleInputChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                        </div>

                        <div className="mb-6">
                            <h3 className="text-lg font-semibold mb-4">Customer Details</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="customerName">
                                        Name*
                                    </label>
                                    <input
                                        type="text"
                                        id="customerName"
                                        name="name"
                                        value={formData.customer.name}
                                        onChange={handleCustomerChange}
                                        className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"

                                        name="address"

                                    />
                                </div>
                            </div>
                        </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">

                                        <th className="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">S.No.</th>
                                        <th className="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>

                                        <th className="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>

                                    </tr>

                                <tbody className="bg-white divide-y divide-gray-200">
                                    {formData.items.map((item, index) => (
                                        <tr key={index}>

                                                    className="shadow appearance-none border rounded w-2/3 py-1 px-2 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-sm"

                                                />
                                                <select

                                                    value={item.description}
                                                    onChange={(e) => handleItemChange(index, e)}
                                                    className="shadow appearance-none border rounded w-1/3 py-1 px-2 text-gray-700 leading-tight focus:outline-none focus:shadow-outline text-sm"
                                                >

                                                        <option key={idx} value={option}>{option}</option>

                                            </td>
                                            <td className="px-4 py-2 whitespace-nowrap">
                                                <input
                                                    type="number"
                                                    name="quantity"
                                                    value={item.quantity}
                                                    onChange={(e) => handleItemChange(index, e)}
                                                    onBlur={restoreDefaultOnBlur(index, 'quantity', 0)}

                                                    step="1"

                                                    step="0.01"
                                                />
                                            </td>

                                                    </button>
                                                )}

                                        </tr>
                                    ))}

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <div className="mb-4">
                                    <label className="block text-gray-700 text-sm font-bold mb-2">
                                        CGST (${formData.taxSettings.cgst}%)
                                    </label>
                                    <input
                                        type="text"
                                        value={totals.cgst.toFixed(2)}
                                        readOnly
                                        className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-gray-100"

                                        type="text"
                                        value={totals.sgst.toFixed(2)}
                                        readOnly
                                        className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-gray-100"

                                    <input
                                        type="text"
                                        value={totals.igst.toFixed(2)}
                                        readOnly
                                        className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-gray-100"

                                </div>

                            <div>
                                <div className="mb-4">
                                    <label className="block text-gray-700 text-sm font-bold mb-2">
                                        Net Amount
                                    </label>
                                    <input
                                        type="text"
                                        value={totals.netAmount.toFixed(2)}
                                        readOnly
                                        className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-gray-100"

                                <div className="mb-4">

                                    </label>
                                    <input

                                    <div className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 min-h-12">

                                <div>
                                    <p><span className="font-semibold">Bank Name:</span> {settings.bankDetails.name}</p>
                                    <p><span className="font-semibold">Account No:</span> {settings.bankDetails.accountNumber}</p>
                                </div>
                                <div>
                                    <p><span className="font-semibold">IFSC Code:</span> {settings.bankDetails.ifsc}</p>
                                    <p><span className="font-semibold">Branch:</span> {settings.bankDetails.branch}</p>
                                </div>
                            </div>
                        </div>

                        <div className="bill-footer pt-4 mt-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="text-center">
                                    <p className="font-semibold">Authorised Signatory</p>
                                    <div className="h-16 border-t border-gray-400 mt-2"></div>
                                </div>
                                <div className="text-center">
                                    <p className="font-semibold">Receiver's Signature</p>
                                    <div className="h-16 border-t border-gray-400 mt-2"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Settings Page Component
        const SettingsPage = ({ settings, onSave, onCancel, createRippleEffect }) => {
            const [formData, setFormData] = useState(settings);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const handleBusinessDetailsChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    businessDetails: {
                        ...prev.businessDetails,
                        [name]: value
                    }
                }));
            };

            const handleReceiverDetailsChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    receiverDetails: {
                        ...prev.receiverDetails,
                        [name]: value
                    }
                }));
            };

            const handleBankDetailsChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    bankDetails: {
                        ...prev.bankDetails,
                        [name]: value
                    }
                }));
            };

            const handleTaxSettingsChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    taxSettings: {
                        ...prev.taxSettings,
                        [name]: parseFloat(value) || 0
                    }
                }));
            };

            const handleBillPreferencesChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    billPreferences: {
                        ...prev.billPreferences,
                        [name]: parseInt(value) || 10
                    }
                }));
            };

            const handleRateMappingChange = (index, e) => {
                const { name, value } = e.target;
                const newMappings = { ...formData.rateMappings };
                const keys = Object.keys(newMappings);
                if (name === 'pattern') {
                    const oldPattern = keys[index];
                    const oldRate = newMappings[oldPattern];
                    delete newMappings[oldPattern];
                    newMappings[value] = oldRate;
                } else if (name === 'rate') {
                    newMappings[keys[index]] = parseFloat(value) || 0;
                }
                setFormData(prev => ({
                    ...prev,
                    rateMappings: newMappings
                }));
            };

            const addRateMapping = () => {
                setFormData(prev => ({
                    ...prev,
                    rateMappings: {
                        ...prev.rateMappings,
                        "": 0
                    }
                }));
            };

            const removeRateMapping = (index) => {
                const newMappings = { ...formData.rateMappings };
                const keys = Object.keys(newMappings);
                delete newMappings[keys[index]];
                setFormData(prev => ({
                    ...prev,
                    rateMappings: newMappings
                }));
            };

            const handleProductDropdownChange = (index, e) => {
                const { name, value } = e.target;
                const newDropdown = [...formData.productDropdown];
                if (name === 'product') {
                    newDropdown[index] = value;
                }
                setFormData(prev => ({
                    ...prev,
                    productDropdown: newDropdown
                }));
            };

            const addProductDropdown = () => {
                setFormData(prev => ({
                    ...prev,
                    productDropdown: [...prev.productDropdown, ""]
                }));
            };

            const removeProductDropdown = (index) => {
                const newDropdown = [...formData.productDropdown];
                newDropdown.splice(index, 1);
                setFormData(prev => ({
                    ...prev,
                    productDropdown: newDropdown
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (!formData.businessDetails.name) {
                    alert('Company name is required');
                    return;
                }

                if (!formData.bankDetails.name) {
                    alert('Bank name is required');
                    return;
                }

                onSave(formData);
            };

            return (
                <div className="slide-in">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800">Settings</h2>
                        <div className="flex space-x-2">
                            <button
                                onClick={(e) => {
                                    e.stopPropagation();
                                    createRippleEffect(e);
                                    onCancel();
                                }}
                                className="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded ripple"
                            >
                                Cancel
                            </button>
                            <button
                                onClick={(e) => {
                                    e.stopPropagation();
                                    createRippleEffect(e);
                                    handleSubmit(e);
                                }}
                                className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded ripple"
                            >
                                Save Changes
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h3 className="text-lg font-semibold mb-4">Company Details</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="businessName">
                                    Company Name*
                                </label>
                                <input
                                    type="text"
                                    id="businessName"
                                    name="name"
                                    value={formData.businessDetails.name}
                                    onChange={handleBusinessDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="businessAddress">
                                    Address
                                </label>
                                <input
                                    type="text"
                                    id="businessAddress"
                                    name="address"
                                    value={formData.businessDetails.address}
                                    onChange={handleBusinessDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="businessGSTIN">
                                    GSTIN
                                </label>
                                <input
                                    type="text"
                                    id="businessGSTIN"
                                    name="gstin"
                                    value={formData.businessDetails.gstin}
                                    onChange={handleBusinessDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="businessState">
                                    State
                                </label>
                                <input
                                    type="text"
                                    id="businessState"
                                    name="state"
                                    value={formData.businessDetails.state}
                                    onChange={handleBusinessDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="businessStateCode">
                                    State Code
                                </label>
                                <input
                                    type="text"
                                    id="businessStateCode"
                                    name="stateCode"
                                    value={formData.businessDetails.stateCode}
                                    onChange={handleBusinessDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h3 className="text-lg font-semibold mb-4">Receiver Details</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="receiverName">
                                    Default Name
                                </label>
                                <input
                                    type="text"
                                    id="receiverName"
                                    name="name"
                                    value={formData.receiverDetails.name}
                                    onChange={handleReceiverDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="receiverAddress">
                                    Default Address
                                </label>
                                <input
                                    type="text"
                                    id="receiverAddress"
                                    name="address"
                                    value={formData.receiverDetails.address}
                                    onChange={handleReceiverDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="receiverGSTIN">
                                    Default GSTIN
                                </label>
                                <input
                                    type="text"
                                    id="receiverGSTIN"
                                    name="gstin"
                                    value={formData.receiverDetails.gstin}
                                    onChange={handleReceiverDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="receiverState">
                                    Default State
                                </label>
                                <input
                                    type="text"
                                    id="receiverState"
                                    name="state"
                                    value={formData.receiverDetails.state}
                                    onChange={handleReceiverDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="receiverStateCode">
                                    Default State Code
                                </label>
                                <input
                                    type="text"
                                    id="receiverStateCode"
                                    name="stateCode"
                                    value={formData.receiverDetails.stateCode}
                                    onChange={handleReceiverDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h3 className="text-lg font-semibold mb-4">Bank Details</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="bankName">
                                    Bank Name*
                                </label>
                                <input
                                    type="text"
                                    id="bankName"
                                    name="name"
                                    value={formData.bankDetails.name}
                                    onChange={handleBankDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="bankAccountNumber">
                                    Account Number
                                </label>
                                <input
                                    type="text"
                                    id="bankAccountNumber"
                                    name="accountNumber"
                                    value={formData.bankDetails.accountNumber}
                                    onChange={handleBankDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="bankIFSC">
                                    IFSC Code
                                </label>
                                <input
                                    type="text"
                                    id="bankIFSC"
                                    name="ifsc"
                                    value={formData.bankDetails.ifsc}
                                    onChange={handleBankDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="bankBranch">
                                    Branch
                                </label>
                                <input
                                    type="text"
                                    id="bankBranch"
                                    name="branch"
                                    value={formData.bankDetails.branch}
                                    onChange={handleBankDetailsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h3 className="text-lg font-semibold mb-4">Tax Settings</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="cgst">
                                    CGST (%)
                                </label>
                                <input
                                    type="number"
                                    id="cgst"
                                    name="cgst"
                                    value={formData.taxSettings.cgst}
                                    onChange={handleTaxSettingsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    min="0"
                                    step="0.01"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="sgst">
                                    SGST (%)
                                </label>
                                <input
                                    type="number"
                                    id="sgst"
                                    name="sgst"
                                    value={formData.taxSettings.sgst}
                                    onChange={handleTaxSettingsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    min="0"
                                    step="0.01"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="igst">
                                    IGST (%)
                                </label>
                                <input
                                    type="number"
                                    id="igst"
                                    name="igst"
                                    value={formData.taxSettings.igst}
                                    onChange={handleTaxSettingsChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    min="0"
                                    step="0.01"
                                />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h3 className="text-lg font-semibold mb-4">Bill Preferences</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="defaultRows">
                                    Default Number of Item Rows
                                </label>
                                <input
                                    type="number"
                                    id="defaultRows"
                                    name="defaultRows"
                                    value={formData.billPreferences.defaultRows}
                                    onChange={handleBillPreferencesChange}
                                    className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    min="1"
                                />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h3 className="text-lg font-semibold mb-4">Rate Mappings</h3>
                        <div className="mb-4">
                            <button
                                onClick={addRateMapping}
                                className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-1 px-3 rounded text-sm ripple"
                            >
                                <i className="fas fa-plus mr-1"></i> Add Mapping
                            </button>
                        </div>
                        {Object.keys(formData.rateMappings).map((pattern, index) => (
                            <div key={index} className="flex items-center gap-2 mb-2">
                                <input
                                    type="text"
                                    name="pattern"
                                    value={pattern}
                                    onChange={(e) => handleRateMappingChange(index, e)}
                                    className="shadow appearance-none border rounded w-1/3 py-1 px-2 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    placeholder="Pattern (e.g., 60 c)"
                                />
                                <input
                                    type="number"
                                    name="rate"
                                    value={formData.rateMappings[pattern]}
                                    onChange={(e) => handleRateMappingChange(index, e)}
                                    className="shadow appearance-none border rounded w-1/3 py-1 px-2 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    min="0"
                                    step="0.01"
                                    placeholder="Rate"
                                />
                                <button
                                    onClick={() => removeRateMapping(index)}
                                    className="text-red-500 hover:text-red-700"
                                >
                                    <i className="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        ))}
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h3 className="text-lg font-semibold mb-4">Product Dropdown</h3>
                        <div className="mb-4">
                            <button
                                onClick={addProductDropdown}
                                className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-1 px-3 rounded text-sm ripple"
                            >
                                <i className="fas fa-plus mr-1"></i> Add Product
                            </button>
                        </div>
                        {formData.productDropdown.map((product, index) => (
                            <div key={index} className="flex items-center gap-2 mb-2">
                                <input
                                    type="text"
                                    name="product"
                                    value={product}
                                    onChange={(e) => handleProductDropdownChange(index, e)}
                                    className="shadow appearance-none border rounded w-full py-1 px-2 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                                    placeholder="Product name"
                                />
                                <button
                                    onClick={() => removeProductDropdown(index)}
                                    className="text-red-500 hover:text-red-700"
                                >
                                    <i className="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
